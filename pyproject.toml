
### File 5: `pyproject.toml`

```toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dometic-pi-control"
version = "1.0.0"
description = "Dometic 39424.602 control daemon for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "RPi.GPIO>=0.7",
    "smbus2>=0.4",
    "bme280>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-PyYAML",
    "hypothesis>=6.92",
]

[project.scripts]
dometic = "dometic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers --timeout=60"
